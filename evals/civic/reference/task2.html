<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brooklyn pothole reports from the city X and Y</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.js"></script>
<style>html, body, #map { margin: 0; height: 100%; } #skipped { position: absolute; top: 8px; left: 8px; background: #fff; padding: 4px 8px; font: 14px sans-serif; }</style>
</head>
<body>
<div id="map"></div>
<script>
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++;}else if(c==='"')q=false;else f+=c;}else if(c==='"')q=true;else if(c===","){row.push(f);f="";}else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";}else if(c!=="\r")f+=c;}if(f||row.length){row.push(f);rows.push(row);}return rows;}
// NAD83 / New York Long Island (ftUS), EPSG:2263: Lambert conformal conic, two standard parallels, GRS80.
// Inverse only: city X/Y in US survey feet -> [lng, lat] in degrees. Used by the reference page and the check.
function nyLongIslandToLngLat(xFt, yFt) {
  const ft = 1200 / 3937, a = 6378137, f = 1 / 298.257222101, e = Math.sqrt(2 * f - f * f);
  const rad = Math.PI / 180, phi1 = 41.03333333333333 * rad, phi2 = 40.66666666666667 * rad, phi0 = 40.16666666666667 * rad, lam0 = -74 * rad;
  const x0 = 300000, y0 = 0;
  const m = (p) => Math.cos(p) / Math.sqrt(1 - e * e * Math.sin(p) ** 2);
  const t = (p) => Math.tan(Math.PI / 4 - p / 2) / ((1 - e * Math.sin(p)) / (1 + e * Math.sin(p))) ** (e / 2);
  const n = (Math.log(m(phi1)) - Math.log(m(phi2))) / (Math.log(t(phi1)) - Math.log(t(phi2)));
  const F = m(phi1) / (n * t(phi1) ** n), r0 = a * F * t(phi0) ** n;
  const x = xFt * ft - x0, y = r0 - (yFt * ft - y0);
  const r = Math.sign(n) * Math.sqrt(x * x + y * y), tt = (r / (a * F)) ** (1 / n), theta = Math.atan2(x, y);
  let phi = Math.PI / 2 - 2 * Math.atan(tt);
  for (let i = 0; i < 8; i++) phi = Math.PI / 2 - 2 * Math.atan(tt * ((1 - e * Math.sin(phi)) / (1 + e * Math.sin(phi))) ** (e / 2));
  return [(theta / n + lam0) / rad, phi / rad];
}

mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;
const map = window.map = new mapboxgl.Map({ container: 'map', style: 'mapbox://styles/mapbox/standard', center: [-73.95, 40.65], zoom: 11 });
const loaded = new Promise((r) => map.on('load', r));
Promise.all([fetch('potholes-xy.csv').then((r) => r.text()), loaded]).then(([text]) => {
  const rows = parseCSV(text), head = rows[0], col = (n) => head.indexOf(n);
  const feats = []; let skipped = 0;
  for (const r of rows.slice(1).filter((r) => r.length === head.length)) {
    const x = parseFloat(r[col('x_coordinate_state_plane')]), y = parseFloat(r[col('y_coordinate_state_plane')]);
    if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
    feats.push({ type: 'Feature', properties: { unique_key: r[col('unique_key')] }, geometry: { type: 'Point', coordinates: nyLongIslandToLngLat(x, y) } });
  }
  map.addSource('potholes', { type: 'geojson', data: { type: 'FeatureCollection', features: feats } });
  map.addLayer({ id: 'potholes', type: 'circle', source: 'potholes', paint: { 'circle-radius': 6, 'circle-color': '#1565c0' } });
  const b = new mapboxgl.LngLatBounds();
  feats.forEach((f) => { const [x, y] = f.geometry.coordinates; if (x || y) b.extend([x, y]); });
  map.fitBounds(b, { padding: 40, duration: 0 });
});
</script>
</body>
</html>
