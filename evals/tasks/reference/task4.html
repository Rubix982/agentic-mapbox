<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery zones</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.js"></script>
<style>html, body { margin: 0; height: 100%; } #map { position: absolute; inset: 0; }</style>
</head>
<body>
<div id="map"></div>
<script>
mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: [-79.39, 43.65],
  zoom: 13,
});
window.map = map;

map.on('load', () => {
  // The file's features have no ids; feature state needs one, so let the source number them.
  map.addSource('zones', { type: 'geojson', data: 'zones.geojson', generateId: true });
  map.addLayer({
    id: 'zones',
    type: 'fill',
    source: 'zones',
    paint: {
      'fill-color': ['case', ['boolean', ['feature-state', 'hover'], false], '#e63946', '#8ecae6'],
      'fill-opacity': 1,
    },
  });

  let hovered = null;
  map.on('mousemove', 'zones', (e) => {
    if (!e.features.length) return;
    const id = e.features[0].id;
    if (hovered !== null && hovered !== id) map.setFeatureState({ source: 'zones', id: hovered }, { hover: false });
    hovered = id;
    map.setFeatureState({ source: 'zones', id }, { hover: true });
  });
  map.on('mouseleave', 'zones', () => {
    if (hovered !== null) map.setFeatureState({ source: 'zones', id: hovered }, { hover: false });
    hovered = null;
  });
});
</script>
</body>
</html>
