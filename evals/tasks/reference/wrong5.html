<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike docks</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.js"></script>
<style>html, body { margin: 0; height: 100%; } #map { position: absolute; inset: 0; }</style>
</head>
<body>
<div id="map"></div>
<script>
mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v12',
  center: [12.5700, 55.6800],
  zoom: 13,
});
window.map = map;

map.on('load', () => {
  map.loadImage('dock.png', (err, image) => {
    if (err) throw err;
    map.addImage('dock', image);
    map.addSource('docks', { type: 'geojson', data: 'docks.geojson' });
    map.addLayer({
      id: 'docks',
      type: 'symbol',
      source: 'docks',
      layout: {
        'icon-image': 'dock',
        'icon-size': 1,
        'icon-anchor': 'center',
        'icon-allow-overlap': true,
        'icon-ignore-placement': true,
        'text-field': ['get', 'name'],
        'text-size': 12,
        'text-anchor': 'top',
        'text-offset': [0, 1.4],
      },
      paint: {
        'text-color': '#222222',
        'text-halo-color': '#ffffff',
        'text-halo-width': 1,
      },
    });
  });
});
</script>
</body>
</html>
