<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick a building</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  config: { basemap: { colorBuildingSelect: '#ff8c00' } },
  center: [2.3577, 48.8612], // the Marais, Paris
  zoom: 17
});
window.map = map;

let selected = null;
map.on('style.load', () => {
  map.addInteraction('select-building', {
    type: 'click',
    target: { featuresetId: 'buildings', importId: 'basemap' },
    handler: (e) => {
      if (selected) map.setFeatureState(selected, { select: false });
      selected = e.feature;
      map.setFeatureState(selected, { select: true });
    }
  });
});
</script>
</body>
</html>
