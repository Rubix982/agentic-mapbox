<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planned buildings with real roofs</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard', // its 3D lights light the buildings (on a classic style they draw black)
  center: [-0.04, 51.5365], // Victoria Park, London
  zoom: 17,
  pitch: 60
});
window.map = map;

map.on('style.load', () => {
  map.addSource('plan', { type: 'geojson', data: 'footprints.geojson' });
  map.addLayer({
    id: 'plan',
    type: 'building',
    source: 'plan',
    layout: {
      'building-height': ['get', 'height_m'],
      'building-roof-shape': ['get', 'roof']
    },
    paint: {
      // GL JS evaluates building-color once per part, with the part in the feature property "building-part"
      'building-color': ['match', ['get', 'building-part'], 'roof', '#b5523b', '#efe6d2']
    }
  });
});
</script>
</body>
</html>
