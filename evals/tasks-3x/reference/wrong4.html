<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global wind animation</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  center: [0, 20],
  zoom: 1
});
window.map = map;

map.on('style.load', () => {
  map.addSource('wind', { type: 'raster-array', url: 'mapbox://mapbox.gfs-winds', tileSize: 512 });
  map.addLayer({
    id: 'wind',
    type: 'raster-particle',
    source: 'wind',
    'source-layer': '10winds',
    paint: {
      'raster-particle-count': 4096,
      'raster-particle-speed-factor': 0.4,
      'raster-particle-fade-opacity-factor': 0.9,
      'raster-particle-reset-rate-factor': 0.4,
      'raster-particle-color': ['interpolate', ['linear'], ['raster-particle-speed'],
        0, '#3288bd',
        10, '#fee08b',
        20, '#d53e4f']
    }
  });
});
</script>
</body>
</html>
