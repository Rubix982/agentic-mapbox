<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearing the redevelopment site</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  center: [2.3606, 48.8647], // Square du Temple, Paris
  zoom: 17,
  pitch: 55
});
window.map = map;

map.on('style.load', () => {
  map.addSource('site', { type: 'geojson', data: 'site.geojson' });
  // Added without a slot, so it sits above the basemap's 3D layers; 'model' also removes the instanced trees.
  map.addLayer({ id: 'site-clip', type: 'clip', source: 'site' });
});
</script>
</body>
</html>
