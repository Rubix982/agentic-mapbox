<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pavilion on the Great Lawn</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;
const PAVILION = [-73.9662, 40.7815]; // Great Lawn, Central Park

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  center: PAVILION,
  zoom: 17,
  pitch: 60
});
window.map = map;

map.on('style.load', () => {
  map.addSource('pavilion', {
    type: 'model',
    models: {
      pavilion: {
        uri: new URL('pavilion.glb', location.href).href,
        position: PAVILION,
        orientation: [0, 0, Math.PI / 2] // a quarter turn
      }
    }
  });
  map.addLayer({ id: 'pavilion', type: 'model', source: 'pavilion' });
});
</script>
</body>
</html>
