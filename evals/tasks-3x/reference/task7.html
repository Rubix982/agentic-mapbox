<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satellite toggle that keeps the route</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.35.2/mapbox-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { position: absolute; inset: 0; }
  #satellite { position: absolute; top: 10px; left: 10px; z-index: 1; padding: 6px 12px; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="map"></div>
<button id="satellite" type="button">Satellite</button>
<script>
mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  center: [-122.407, 37.786], // downtown San Francisco
  zoom: 14.5
});
window.map = map;

map.on('load', () => {
  map.addSource('route', { type: 'geojson', data: 'route.geojson' });
  map.addLayer({
    id: 'route',
    type: 'line',
    source: 'route',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#d81b60', 'line-width': 5 }
  });
});

document.getElementById('satellite').addEventListener('click', () => {
  // swap only the imported basemap; the route lives in the root style and is kept
  map.updateImport('basemap', 'mapbox://styles/mapbox/standard-satellite');
});
</script>
</body>
</html>
